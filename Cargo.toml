[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-v3",
    "zkir-wasm",
    "zkir-v3-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core"
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Because we pull in older, crates.io versions of `transient-crypto`, we need
# to force these to resolve locally for a local build. These patches not being
# present in consumer builds is fine, as they don't/shouldn't *want* the local
# packages.
[patch.crates-io]
midnight-base-crypto = { path = "base-crypto" }
midnight-serialize = { path = "serialize" }
# Because we rely on additions in 2.2
midnight-transient-crypto-old = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1", package = "midnight-transient-crypto" }
# The pinned midnight-zkir asks crates.io for transient-crypto 3.0.0, which is
# unpublished; resolve it to the in-tree copy.
midnight-transient-crypto = { path = "transient-crypto" }
# GPU acceleration: Ledger 9 links TWO zk stacks, so BOTH semver lines of
# midnight-proofs + midnight-curves are redirected (Cargo multi-version patch:
# distinct keys + `package`). Every crates.io consumer of each line --
# midnight-circuits 6.3/7.2, midnight-zk-stdlib 1.3/2.3, blake2b_halo2,
# sha3-circuit, transient-crypto-old (git), midnight-zkir 3.1 (git) -- then
# links the patched crate, so circuits/zk-stdlib need no patch of their own.
# Both forks are expected as siblings of this checkout:
#   v1 line (0.7.x / 0.2.x): midnight-zk-gpu (branch main) -- legacy zkir pipeline
#     (IR V0/V1): Zswap spend/output/sign, Dust spend, compactc's default zkir 2.0.
midnight-proofs = { path = "../midnight-zk-gpu/proofs" }
midnight-curves = { path = "../midnight-zk-gpu/curves" }
#   v2 line (0.8.x / 0.3.x): midnight-zk-gpu-v2 (branch port/proofs-0.8.2) -- current
#     pipeline (IR V2+, zkir 2.2) and zkir-v3. Must stay >= 0.8.2 / 0.3.1: circuits
#     7.2.4 and zk-stdlib 2.3.5 require it, and a lower version leaves the patch
#     silently unused.
midnight-proofs-v2 = { path = "../midnight-zk-gpu-v2/proofs", package = "midnight-proofs" }
midnight-curves-v2 = { path = "../midnight-zk-gpu-v2/curves", package = "midnight-curves" }

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"
